[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ostutor"
version = "0.4.0"
description = "Deterministic interleaving explorer with checked LLM narration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ostutor = "ostutor.cli:main"

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
rag = ["pypdf>=4", "python-pptx>=0.6.23"]
embed = ["sentence-transformers>=2.7"]   # real dense embeddings (bge); large download
dev = ["pytest>=9.1.1", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8", "build>=1.0", "streamlit>=1.40",
       "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pypdf>=4", "python-pptx>=0.6.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "E731", "E741", "B905"]  # compact style is used on purpose

[tool.mypy]
python_version = "3.11"
files = ["src/ostutor"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.coverage.run]
source = ["src/ostutor"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
