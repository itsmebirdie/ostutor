[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ostutor"
version = "0.2.0"
description = "Deterministic interleaving explorer with checked LLM narration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ostutor = "ostutor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
