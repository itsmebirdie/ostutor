name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repository. No secrets are used anywhere in this file,
# so pull requests from forks cannot leak an API key (the tests are fully offline).
permissions:
  contents: read

env:
  PYTHONUTF8: "1"  # same behaviour on Windows runners

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy

  test:
    name: Tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:  # the team may be on Windows/macOS laptops: check one version there too
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: pytest with coverage (fails under 90%)
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  gate:
    name: Acceptance gate (installed package)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install the built package WITHOUT dev tools, from a clean directory, to prove the
      # entry point works for a user and that there are no hidden runtime dependencies.
      - name: Install package
        run: python -m pip install .
      - name: Every example program gets its hand-verified label
        run: |
          check() {
            out=$(ostutor analyze "data/programs/$1.ost")
            echo "$out" | grep -q "label        : $2" || { echo "FAIL: $1 expected $2"; echo "$out"; exit 1; }
            echo "ok  $1 -> $2"
          }
          check deadlock_two_locks deadlock
          check race_no_lock race
          check safe_with_lock safe
          check dining_3_deadlock deadlock
          check dining_3_ordered safe
          check loop_counter_locked safe
      - name: Slice demo exits 0 (checker rejects all tampered narrations)
        run: python -m ostutor.slice.demo --all --tamper
      - name: Parse errors exit 2 with a line number
        run: |
          printf 'mutex a\nthread T1:\n  wait a\n' > bad.ost
          set +e; ostutor analyze bad.ost 2> err.txt; code=$?; set -e
          cat err.txt; test "$code" -eq 2; grep -q "line 3" err.txt
      - name: Without an API key --llm degrades to the template (exit 0)
        run: ostutor analyze data/programs/race_no_lock.ost --llm | grep -q "template fall-back"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
