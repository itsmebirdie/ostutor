name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repository. No secrets are used anywhere in this file,
# so pull requests from forks cannot leak an API key (the tests are fully offline).
permissions:
  contents: read

env:
  PYTHONUTF8: "1"  # same behaviour on Windows runners

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy

  test:
    name: Tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:  # the team may be on Windows/macOS laptops: check one version there too
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: pytest with coverage (fails under 90%)
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  gate:
    name: Acceptance gate (installed package)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install the built package WITHOUT dev tools, from a clean directory, to prove the
      # entry point works for a user and that there are no hidden runtime dependencies.
      - name: Install package
        run: python -m pip install .
      - name: Every example program gets its hand-verified label
        run: |
          check() {
            out=$(ostutor analyze "data/programs/$1.ost")
            echo "$out" | grep -q "label        : $2" || { echo "FAIL: $1 expected $2"; echo "$out"; exit 1; }
            echo "ok  $1 -> $2"
          }
          check deadlock_two_locks deadlock
          check race_no_lock race
          check safe_with_lock safe
          check dining_3_deadlock deadlock
          check dining_3_ordered safe
          check loop_counter_locked safe
          check producer_consumer_ok safe
          check producer_consumer_bad_order deadlock
          check lost_signal lost_signal
          check dining_5_deadlock deadlock
          check starvation_unfair_mutex starvation
          check starvation_blocked_forever starvation
      - name: Fairness assumption changes the starvation verdict
        run: |
          ostutor analyze data/programs/starvation_unfair_mutex.ost --fairness weak | grep -q "label        : starvation"
          ostutor analyze data/programs/starvation_unfair_mutex.ost --fairness strong | grep -q "label        : safe"
      - name: Tier B reduces dining philosophers; Tier C is labelled sampled
        run: |
          ostutor analyze data/programs/dining_5_deadlock.ost --tier B | grep -q "reduced_but_complete"
          ostutor analyze data/programs/dining_5_deadlock.ost --tier C | grep -q "sampled"
      - name: Slice demo exits 0 (checker rejects all tampered narrations)
        run: python -m ostutor.slice.demo --all --tamper
      - name: API serves requests from the installed package
        run: |
          python -m pip install ".[api]" httpx
          uvicorn ostutor.api.app:app --port 8765 &
          for i in $(seq 1 20); do curl -sf localhost:8765/health && break; sleep 1; done
          curl -sf -X POST localhost:8765/simulate -H 'content-type: application/json' \
            -d '{"problem":{"topic":"disk","algorithm":"sstf","params":{"requests":[98,183,37,122,14,124,65,67],"head":53}}}' \
            | grep -q '"total_head_movement":236'
          curl -sf -X POST localhost:8765/diagnose -H 'content-type: application/json' \
            -d '{"problem":{"topic":"cpu","algorithm":"rr","params":{"procs":[["P1",0,5],["P2",1,3],["P3",2,1]],"quantum":2}},"answer":"P1 P1 P2 P2 P1 P1 P3 P2 P1"}' \
            | grep -q rr_preempted_before_new_arrival
      - name: Parse errors exit 2 with a line number
        run: |
          printf 'mutex a\nthread T1:\n  sleep 5\n' > bad.ost
          set +e; ostutor analyze bad.ost 2> err.txt; code=$?; set -e
          cat err.txt; test "$code" -eq 2; grep -q "line 3" err.txt
      - name: Without an API key --llm degrades to the template (exit 0)
        run: ostutor analyze data/programs/race_no_lock.ost --llm | grep -q "template fall-back"

  evaluation:
    name: Evaluation scripts
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Run every evaluation (fails if any script errors or a replay fails)
        run: python eval/run_all.py
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
