name: LLM live check

# Manual only. Spends a few tokens on the real provider to confirm the key and endpoint work.
# Never runs on pull requests, so forks cannot reach the secret and CI never burns the daily cap.
# Setup: Settings > Secrets and variables > Actions > New repository secret > GROQ_API_KEY
on:
  workflow_dispatch:
    inputs:
      narrate:
        description: "Also run one real checked narration (about 1,000 tokens)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    environment: llm   # optional: add required reviewers to this environment for extra safety
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Ping the provider
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: ostutor ping
      - name: One real checked narration
        if: inputs.narrate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: ostutor analyze data/programs/deadlock_two_locks.ost --llm
